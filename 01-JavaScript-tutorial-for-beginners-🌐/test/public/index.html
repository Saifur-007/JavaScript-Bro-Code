<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Live Clock</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="clock-card">
    <p class="label">A little JavaScript project</p>
    <h1>My Live Clock</h1>
    <p id="clock" role="timer" aria-label="Current local time">--:--:--</p>
    <p id="date">Loading date...</p>
    <p class="note">Your local time. Updated every second.</p>
    <noscript>Please enable JavaScript to see the live clock.</noscript>
  </main>
</body>
</html>
