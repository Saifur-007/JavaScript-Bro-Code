<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature-conversion-program</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <section>
        <h1>Temperature Conversion:</h1>
        <input type="text" id="userInput">
        <div class="inputBox">
            <input type="checkbox" id="celsiusBox" name="celsiusBox" value="celsiusBox">
            <label for="celsiusBox">Celsius to Fahrenheit</label><br>
            <input type="checkbox" id="fahrenheitBox" name="fahrenheitBox" value="fahrenheitBox">
            <label for="fahrenheitBox">Fahrenheit to Celsius</label><br>
        </div>
        <button>Submit</button>
        <p></p>
    </section>
</body>
</html>
